name: macOS menu bar app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "macos/MSFMenuBar/**"
      - "cmd/msf/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/macos-menu-bar.yml"
  push:
    branches:
      - "main"
    paths:
      - "macos/MSFMenuBar/**"
      - "cmd/msf/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/macos-menu-bar.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run Go tests
        run: go test ./...

      - name: Run Swift package tests
        run: make macos-app-test XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - name: Build unsigned Debug and Release apps
        run: make macos-app-build-debug macos-app-build-release XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - name: Verify Debug app bundle
        run: MSF_REQUIRE_LEGACY_ONLY=1 make macos-app-verify MACOS_CONFIGURATION=Debug XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - name: Verify Release app bundle
        run: MSF_REQUIRE_LEGACY_ONLY=1 make macos-app-verify MACOS_CONFIGURATION=Release XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - uses: actions/upload-artifact@v4
        with:
          name: MSF-macOS-unsigned
          path: |
            macos/MSFMenuBar/DerivedData/Build/Products/Debug/MSF.app
            macos/MSFMenuBar/DerivedData/Build/Products/Release/MSF.app
          if-no-files-found: error
