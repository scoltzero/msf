name: Release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      build_time: ${{ steps.source.outputs.build_time }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release assets must be built from a version tag" >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "$commit" = "$tag_commit"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" origin/main || {
            echo "Release tag commit must be reachable from main" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "tag=${GITHUB_REF_NAME}"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

  linux-assets:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Test source
        run: |
          go test ./...
          npm --prefix web run check

      - name: Build and verify Linux, Unraid, and fnOS assets
        run: |
          make release-assets \
            VERSION=${{ needs.source.outputs.version }} \
            RELEASE_TAG=${{ needs.source.outputs.tag }} \
            BUILD_TIME=${{ needs.source.outputs.build_time }}

      - name: Prepare TUN smoke-test host
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe tun 2>/dev/null || true
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 666 /dev/net/tun

      - name: Black-box factory-reset and TUN smoke tests
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.source.outputs.version }}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/unraid" "$tmp/fnos-x86" "$tmp/fnos-arm" "$tmp/fnos-x86-app" "$tmp/fnos-arm-app"
          tar -xJf "dist/unraid/msf-${version}-x86_64-1.txz" -C "$tmp/unraid"
          tar -xzf "dist/msf_${version}_x86.fpk" -C "$tmp/fnos-x86"
          tar -xzf "dist/msf_${version}_arm.fpk" -C "$tmp/fnos-arm"
          tar -xzf "$tmp/fnos-x86/app.tgz" -C "$tmp/fnos-x86-app"
          tar -xzf "$tmp/fnos-arm/app.tgz" -C "$tmp/fnos-arm-app"
          binaries=(
            "dist/msf-linux-amd64"
            "dist/msf-linux-arm64"
            "$tmp/unraid/usr/local/emhttp/plugins/msf/bin/msf"
            "$tmp/fnos-x86-app/msf"
            "$tmp/fnos-arm-app/msf"
          )
          for binary in "${binaries[@]}"; do
            sudo -E unshare --net -- scripts/release/smoke-factory-reset.sh "$binary"
          done

      - name: Upload Linux, Unraid, and fnOS assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/msf-linux-amd64.tar.gz
            dist/msf-linux-amd64.tar.gz.sha256
            dist/msf-linux-arm64.tar.gz
            dist/msf-linux-arm64.tar.gz.sha256
            dist/unraid/msf-${{ needs.source.outputs.version }}-x86_64-1.txz
            dist/unraid/msf-${{ needs.source.outputs.version }}-x86_64-1.txz.sha256
            dist/unraid/msf.plg
            dist/unraid/msf.plg.sha256
            dist/msf_${{ needs.source.outputs.version }}_x86.fpk
            dist/msf_${{ needs.source.outputs.version }}_x86.fpk.sha256
            dist/msf_${{ needs.source.outputs.version }}_arm.fpk
            dist/msf_${{ needs.source.outputs.version }}_arm.fpk.sha256

  macos-assets:
    needs: source
    runs-on: macos-15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test macOS source
        run: |
          go test ./...
          npm --prefix web ci
          npm --prefix web run check
          make macos-app-test XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - name: Reclaim macOS packaging space
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          rm -rf \
            macos/MSFMenuBar/.build \
            macos/MSFMenuBar/DerivedData \
            web/node_modules
          df -h .

      - name: Build and package unsigned macOS beta assets
        run: |
          echo "::warning::The macOS Beta is intentionally unsigned and uses the legacy administrator installer."
          make macos-release-assets \
            VERSION=${{ needs.source.outputs.version }} \
            RELEASE_TAG=${{ needs.source.outputs.tag }} \
            BUILD_TIME=${{ needs.source.outputs.build_time }} \
            MACOS_BUILD_NUMBER=${GITHUB_RUN_NUMBER} \
            XCODE_DEVELOPER_DIR="$(xcode-select -p)"

      - name: Upload unsigned macOS beta assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/macos/MSF-${{ needs.source.outputs.version }}-macos-universal-unsigned.dmg
            dist/macos/MSF-${{ needs.source.outputs.version }}-macos-universal-unsigned.dmg.sha256
            dist/macos/MSF-${{ needs.source.outputs.version }}-macos-universal-unsigned.zip
            dist/macos/MSF-${{ needs.source.outputs.version }}-macos-universal-unsigned.zip.sha256

  publish:
    needs:
      - source
      - linux-assets
      - macos-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux, Unraid, and fnOS assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux-assets
          path: dist

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos-assets
          path: dist/macos

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.source.outputs.version }}"
          notes_file="dist/release-notes.md"
          awk -v tag="${{ needs.source.outputs.tag }}" '
            index($0, "## " tag " - ") == 1 { capture=1 }
            capture && printed && /^## v/ { exit }
            capture { print; printed=1 }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          assets=(
            "dist/msf-linux-amd64.tar.gz"
            "dist/msf-linux-amd64.tar.gz.sha256"
            "dist/msf-linux-arm64.tar.gz"
            "dist/msf-linux-arm64.tar.gz.sha256"
            "dist/unraid/msf-${version}-x86_64-1.txz"
            "dist/unraid/msf-${version}-x86_64-1.txz.sha256"
            "dist/unraid/msf.plg"
            "dist/unraid/msf.plg.sha256"
            "dist/msf_${version}_x86.fpk"
            "dist/msf_${version}_x86.fpk.sha256"
            "dist/msf_${version}_arm.fpk"
            "dist/msf_${version}_arm.fpk.sha256"
            "dist/macos/MSF-${version}-macos-universal-unsigned.dmg"
            "dist/macos/MSF-${version}-macos-universal-unsigned.dmg.sha256"
            "dist/macos/MSF-${version}-macos-universal-unsigned.zip"
            "dist/macos/MSF-${version}-macos-universal-unsigned.zip.sha256"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done
          sha256sum -c \
            dist/msf-linux-amd64.tar.gz.sha256 \
            dist/msf-linux-arm64.tar.gz.sha256 \
            "dist/unraid/msf-${version}-x86_64-1.txz.sha256" \
            dist/unraid/msf.plg.sha256 \
            "dist/msf_${version}_x86.fpk.sha256" \
            "dist/msf_${version}_arm.fpk.sha256"
          (
            cd dist/macos
            sha256sum -c \
              "MSF-${version}-macos-universal-unsigned.dmg.sha256" \
              "MSF-${version}-macos-universal-unsigned.zip.sha256"
          )
          gh release create "${{ needs.source.outputs.tag }}" \
            --verify-tag \
            --title "${{ needs.source.outputs.tag }}" \
            --notes-file "$notes_file" \
            "${assets[@]}"
