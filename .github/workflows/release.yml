name: Release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      build_time: ${{ steps.source.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: source
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]
          commit="$(git rev-parse HEAD)"
          test "$(git rev-list -n 1 "$tag")" = "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  linux-amd64-assets:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and verify Linux amd64 asset
        shell: bash
        run: |
          set -euo pipefail
          make release-assets \
            VERSION=${{ needs.source.outputs.version }} \
            RELEASE_TAG=${{ needs.source.outputs.tag }} \
            SOURCE_COMMIT=${{ needs.source.outputs.commit }} \
            BUILD_TIME=${{ needs.source.outputs.build_time }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/msf-linux-amd64.tar.gz
            dist/msf-linux-amd64.tar.gz.sha256

  publish:
    needs:
      - source
      - linux-amd64-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-linux-amd64-assets
          path: dist

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="dist/release-notes.md"
          awk -v tag="${{ needs.source.outputs.tag }}" '
            index($0, "## " tag " - ") == 1 { capture=1 }
            capture && printed && /^## v/ { exit }
            capture { print; printed=1 }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          sha256sum -c dist/msf-linux-amd64.tar.gz.sha256
          gh release create "${{ needs.source.outputs.tag }}" \
            --verify-tag \
            --title "${{ needs.source.outputs.tag }}" \
            --notes-file "$notes_file" \
            dist/msf-linux-amd64.tar.gz \
            dist/msf-linux-amd64.tar.gz.sha256
