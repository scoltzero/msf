<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSF Mizar Orbit Weave Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #0079ee;
      --speed-progress: 33.33%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 877.8px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 300ms cubic-bezier(0.16,1,0.3,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 2200ms;
        --p2m-ease-orbit: cubic-bezier(0.37, 0, 0.16, 1);
        --p2m-ease-weave: cubic-bezier(0.22, 0.74, 0.18, 1);
        --p2m-ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
      }

      #motion-ribbons,
      #orbit-blue-ribbon,
      #orbit-cyan-ribbon,
      #weave-blue-ribbon,
      #weave-cyan-ribbon,
      #logo-geometry {
        transform-box: view-box;
        transform-origin: 627px 627px;
        will-change: transform, opacity, clip-path;
      }

      #motion-ribbons {
        animation: p2m-ribbon-stage var(--p2m-duration) linear both;
      }

      #orbit-blue-ribbon {
        animation: p2m-blue-orbit-body var(--p2m-duration) linear both;
      }

      #orbit-cyan-ribbon {
        animation: p2m-cyan-orbit-body var(--p2m-duration) linear both;
      }

      .orbit-blue-track {
        animation: p2m-blue-orbit-dash var(--p2m-duration) linear both;
      }

      .orbit-cyan-track {
        animation: p2m-cyan-orbit-dash var(--p2m-duration) linear both;
      }

      #weave-blue-ribbon {
        animation: p2m-blue-weave-body var(--p2m-duration) linear both;
      }

      #weave-cyan-ribbon {
        animation: p2m-cyan-weave-body var(--p2m-duration) linear both;
      }

      .weave-blue-track {
        animation: p2m-blue-weave-dash var(--p2m-duration) linear both;
      }

      .weave-cyan-track {
        animation: p2m-cyan-weave-dash var(--p2m-duration) linear both;
      }

      #logo-geometry {
        animation: p2m-final-form var(--p2m-duration) linear both;
      }

      .orbit-shadow {
        stroke-width: 82px;
        stroke-opacity: 0.2;
        filter: none;
      }

      .weave-shadow {
        stroke-width: 122px;
        stroke-opacity: 0.18;
        filter: none;
      }

      .orbit-sheen,
      .weave-sheen {
        display: none;
      }

      @keyframes p2m-ribbon-stage {
        0%,
        3% {
          opacity: 0;
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* settle */
        }
        8%,
        79% {
          opacity: 1;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* premium fade */
        }
        88%,
        100% {
          opacity: 0;
        }
      }

      /* The temporary ribbons orbit in mirrored arcs; no logo geometry moves yet. */
      @keyframes p2m-blue-orbit-body {
        0% {
          transform: rotate(-11deg) scale(0.9);
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        18% {
          transform: rotate(-5deg) scale(0.96);
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        45% {
          transform: rotate(4.5deg) scale(1.025);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        61%,
        100% {
          transform: rotate(8deg) scale(1.055);
        }
      }

      @keyframes p2m-cyan-orbit-body {
        0%,
        3% {
          transform: rotate(11deg) scale(0.9);
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        21% {
          transform: rotate(5deg) scale(0.96);
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        48% {
          transform: rotate(-4.5deg) scale(1.025);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        64%,
        100% {
          transform: rotate(-8deg) scale(1.055);
        }
      }

      @keyframes p2m-blue-orbit-dash {
        0%,
        4% {
          opacity: 0;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 1.15;
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        10% {
          opacity: 1;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 0.95;
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        34% {
          opacity: 1;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 0.12;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        47% {
          opacity: 0.54;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: -0.28;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        55%,
        100% {
          opacity: 0;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: -0.48;
        }
      }

      @keyframes p2m-cyan-orbit-dash {
        0%,
        7% {
          opacity: 0;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 1.15;
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        13% {
          opacity: 1;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 0.95;
          animation-timing-function: cubic-bezier(0.37, 0, 0.16, 1); /* orbit */
        }
        37% {
          opacity: 1;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: 0.12;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        50% {
          opacity: 0.54;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: -0.28;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        58%,
        100% {
          opacity: 0;
          stroke-dasharray: 0.28 1.2;
          stroke-dashoffset: -0.48;
        }
      }

      /* The orbiting actors align with centerlines that echo the final blue/cyan fills. */
      @keyframes p2m-blue-weave-body {
        0%,
        40% {
          transform: rotate(2.8deg) scale(0.955);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        70% {
          transform: rotate(0deg) scale(1.008);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* settle */
        }
        82%,
        100% {
          transform: none;
        }
      }

      @keyframes p2m-cyan-weave-body {
        0%,
        43% {
          transform: rotate(-2.8deg) scale(0.955);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        73% {
          transform: rotate(0deg) scale(1.008);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* settle */
        }
        84%,
        100% {
          transform: none;
        }
      }

      @keyframes p2m-blue-weave-dash {
        0%,
        40% {
          opacity: 0;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 1.12;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        44% {
          opacity: 1;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 1;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        69% {
          opacity: 1;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        76% {
          opacity: 0.46;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        83%,
        100% {
          opacity: 0;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
        }
      }

      @keyframes p2m-cyan-weave-dash {
        0%,
        43% {
          opacity: 0;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 1.12;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        47% {
          opacity: 1;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 1;
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        72% {
          opacity: 1;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        79% {
          opacity: 0.42;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* dissolve */
        }
        86%,
        100% {
          opacity: 0;
          stroke-dasharray: 1 1.2;
          stroke-dashoffset: 0;
        }
      }

      /* The verified vector is revealed from the actual central crossing, then lands exactly. */
      @keyframes p2m-final-form {
        0%,
        64% {
          opacity: 0;
          transform: scale(0.965);
          clip-path: circle(0% at 51.1% 41%);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        70% {
          opacity: 0.34;
          transform: scale(0.985);
          clip-path: circle(32% at 51.1% 41%);
          animation-timing-function: cubic-bezier(0.22, 0.74, 0.18, 1); /* weave */
        }
        81% {
          opacity: 1;
          transform: scale(1.008);
          clip-path: circle(80% at 51.1% 41%);
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* settle */
        }
        90% {
          opacity: 1;
          transform: scale(1.0015);
          clip-path: none;
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* settle */
        }
        100% {
          opacity: 1;
          transform: none;
          clip-path: none;
        }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="2200"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Orbit</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Coupling</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Weave</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Lock</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">1.00x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Inspect orbit and weave timing</p>

4 267 1029 298 C1034 329 1034 464.5 1034 600 C1033 632 1029 662 1025 690 C1028.8 612.5 1003.7 543.4 963 483 C952 472 939 465 926 462 C903 462 889 466 871 476 C840 507 756 608 698 668 C680 681 662 694 640 702 C627.5 702 615 702 601 696 C587 690 577 683 567 676 C533 646 499 611 475 578 C492 597 509 610 536 609 C579 604 617 550 641 512 Z\" fill=\"url(#center-cyan)\"/>\n<path id=\"layer-right-fold\" class=\"engine-cyan engine-cyan-detail\" d=\"M926 462 C943 467 954 475 963 483 C1003.82 543.58 1030.31 612.09 1025 690 C1024 715 1018 743 1006 771 C989 790 972 799 952 805 C924 796 897 782 868 763 C892 730 926 676 942 641 C958 606 970 549 970 530 C970 499 952 469.65 926 462 Z\" fill=\"url(#right-fold)\"/>\n<path id=\"layer-contact-shadow\" class=\"engine-blue engine-blue-detail\" d=\"M475 578 C492.98 596.14 510.18 610.38 536 609 C584.89 603.46 614.82 548.17 641 512 C616.4 552.1 581.45 606.23 536 611 C509.1 613.2 491 598.6 475 578 Z\" fill=\"url(#contact-shadow)\" filter=\"url(#contact-soft)\"/>\n<path id=\"layer-upper-blue\" class=\"engine-blue engine-blue-primary\" d=\"M223 684 C214 620 212 540 213 307 C213 248 242 204 299 191 C326 187 366 190 396 213 C426 235 472 281 510 327 C557 386 602 454 641 512 C614.82 548.17 584.89 603.46 536 609 C510.18 610.38 492.98 596.14 475 578 L451 545 C403 485 390 475 368 463 C344 452 313 455 296 478 C292 482 290 487 289 491 L284 492 C245.85 547.69 225.48 613.76 227.5 680 Z\" fill=\"url(#upper-blue)\"/>\n<\/g>\n<g id=\"connection-glint\" aria-hidden=\"true\" opacity=\"0\" pointer-events=\"none\">\n<circle cx=\"641\" cy=\"512\" r=\"54\" fill=\"url(#connection-glow)\" filter=\"url(#connection-glow-soft)\"/>\n<circle cx=\"641\" cy=\"512\" r=\"8\" fill=\"#F4FFFF\"/>\n<\/g>\n<\/g>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 2200;

    let playbackRate = 1;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "staging"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "appeal");
        hover.style.transform = "translateY(-2px) scale(1.03) rotate(-1deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 1000) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.022 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -7;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.065;
        arcVel *= 0.83;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 14;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("timing", "appeal");
        press.style.transform = "scale(0.975)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      const finalMode = staticMode !== null || (seekMs !== null && Number(seekMs) >= DURATION);
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (finalMode) {
            animation.cancel();
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 1 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(1, false);
    renderHero();
    applyQaMode();
  </script>
